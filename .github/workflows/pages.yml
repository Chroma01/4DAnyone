name: Deploy project page
run-name: Deploy page ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit on the temporary gh-pages branch
        required: true
        type: string
      release_sha:
        description: Source snapshot in krahets/4danyone-page
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate repository and dispatch inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            4danyone/4danyone.github.io|ant-research/4DAnyone) ;;
            *) echo "Unsupported Pages target: $GITHUB_REPOSITORY" >&2; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the temporary page snapshot
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the static snapshot
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git -C site rev-parse HEAD)
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $actual_sha, expected $SOURCE_SHA" >&2
            exit 1
          fi
          test -f site/index.html
          test -f site/.nojekyll
          test -d site/assets
          for path in .dev .github tools CLAUDE.md README.md .gitignore; do
            test ! -e "site/$path"
          done
          find site/.git -depth -delete
          if find site -type l -print -quit | grep -q .; then
            echo "The Pages artifact must not contain symbolic links" >&2
            exit 1
          fi
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Remove the temporary gh-pages branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref_json=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" || true)
          remote_sha=$(printf '%s\n' "$ref_json" | jq -r '.object.sha // empty')
          if [[ -z "$remote_sha" ]]; then
            echo "gh-pages is already absent"
          elif [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "gh-pages moved to $remote_sha; refusing to delete it" >&2
          else
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages"
          fi

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
